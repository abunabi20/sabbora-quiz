<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#c2417a">
<title>سبورة | منصة الاختبارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23c2417a'/%3E%3Cpath d='M12 4l2 5.5L19.5 11 14 13l-2 5.5L10 13l-5.5-2L10 9.5z' fill='%23ffd27a'/%3E%3C/svg%3E">
<style>
/*
VOICE: هادئ ودافئ، يشبه دفتر معلّمة مرتب ومحبوب
IDEA: سبورة خضراء هادئة وأوراق ملاحظات ملونة تتحول إلى واجهة رقمية
PICTURE: حلقة الدرجة الكبيرة، بطاقات الأسئلة، وشهادات مزخرفة
COLOUR and TYPE: أخضر صنوبري سائد، نعناعي داعم، مرجاني للتمييز، ذهبي للاحتفال. Readex Pro و Reem Kufi
LAYOUT: شريط جانبي على الشاشات الكبيرة وشريط سفلي على الجوال، محتوى حتى 1240px
*/
:root{color-scheme:light dark;
--bg:light-dark(#fbf2f6,#170d12);--bg2:light-dark(#f7e4ec,#1d1117);
--surface:light-dark(#ffffff,#22141b);--surface2:light-dark(#fdf3f7,#2a1922);
--ink:light-dark(#3b1429,#f7e8ef);--muted:light-dark(#8c5f74,#c7a3b4);
--line:light-dark(#f1d7e2,#46283a);
--brand:light-dark(#c2417a,#f283b4);--brand2:light-dark(#a3305f,#f7a3c8);--brandSoft:light-dark(#fce3ee,#4a2035);
--onbrand:light-dark(#ffffff,#2a0b19);
--accent:light-dark(#8a5cc9,#b896f0);--accentSoft:light-dark(#efe6fb,#2f2244);
--gold:light-dark(#e0a22a,#f2c25a);--goldSoft:light-dark(#fcf1d9,#3a2f14);
--ok:light-dark(#22895c,#4cd391);--okSoft:light-dark(#dcf3e7,#123224);
--bad:light-dark(#cc4141,#ff7b7b);--badSoft:light-dark(#fbe1e1,#3a1717);
--warn:light-dark(#b97f00,#f5c44f);--warnSoft:light-dark(#fff1cc,#3a3011);
--sh:0 1px 2px rgba(80,15,45,.06),0 8px 24px rgba(80,15,45,.08);
--r:18px;--rs:12px}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Readex Pro",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Reem Kufi","Readex Pro",sans-serif;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:clamp(21px,2.6vw,26px)}h3{font-size:18px}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:13.5px}.center{text-align:center}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.grow{flex:1}

/* shell */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--brand);color:var(--onbrand);padding:22px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;
 background-image:radial-gradient(circle at 120% -10%,rgba(255,255,255,.16),transparent 45%),radial-gradient(circle at -30% 110%,rgba(138,92,201,.3),transparent 50%)}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo b{font-family:"Reem Kufi";font-size:22px;line-height:1.1}
.logo small{display:block;opacity:.75;font-size:12.5px;font-family:"Readex Pro"}
.nav{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:0;background:none;color:inherit;cursor:pointer;text-align:start;font-weight:500;opacity:.86;min-height:44px;width:100%}
.nav:hover{background:rgba(255,255,255,.1);opacity:1}
.nav.on{background:var(--surface);color:var(--brand);opacity:1;box-shadow:var(--sh)}
.nav svg{width:21px;height:21px;flex:none}
.nav .badge{margin-inline-start:auto}
.side .me{margin-top:auto;padding:12px;border-radius:14px;background:rgba(0,0,0,.14);font-size:14px}
.main{padding:clamp(16px,3vw,36px) clamp(14px,3.4vw,44px) 110px;max-width:1240px;width:100%;margin-inline:auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top .t{display:flex;flex-direction:column;gap:4px}
.bnav{display:none}
@media(max-width:860px){
 .shell{grid-template-columns:1fr}.side{display:none}
 .bnav{display:flex;position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;gap:2px;box-shadow:0 -6px 20px rgba(0,0,0,.06)}
 .bnav .nav{flex:1 0 66px;flex-direction:column;gap:2px;font-size:11.5px;padding:7px 4px;justify-content:center;color:var(--muted);opacity:1;position:relative}
 .bnav .nav.on{background:var(--brandSoft);color:var(--brand);box-shadow:none}
 .bnav .badge{position:absolute;top:2px;inset-inline-end:10px;margin:0}
 .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;background:var(--brand);color:var(--onbrand);padding:12px 16px;margin:-16px -14px 18px;border-radius:0 0 22px 22px}
.mtop b{font-family:"Reem Kufi";font-size:19px}

/* atoms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card h3{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:14px;border:1px solid transparent;background:var(--brand);color:var(--onbrand);font-weight:600;cursor:pointer;transition:transform .12s,filter .12s;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--brandSoft);color:var(--brand)}
.btn.acc{background:var(--accent);color:#fff}
.btn.gold{background:var(--gold);color:#2a1d00}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.okb{background:var(--okSoft);color:var(--ok)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.icon{padding:8px;min-width:40px}
.btn svg{width:18px;height:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip.ok{background:var(--okSoft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--badSoft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warnSoft);color:var(--warn);border-color:transparent}
.chip.br{background:var(--brandSoft);color:var(--brand);border-color:transparent}
.chip.acc{background:var(--accentSoft);color:var(--accent);border-color:transparent}
.chip.gold{background:var(--goldSoft);color:var(--warn);border-color:transparent}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14.5px}
.in,select.in,textarea.in{width:100%;min-height:46px;padding:11px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--surface2);font-size:16px;transition:border-color .15s,background .15s}
.in:focus{border-color:var(--brand);background:var(--surface);outline:none}
textarea.in{min-height:96px;resize:vertical;line-height:1.6}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-size:14.5px}
.pick input:checked+span{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.pick input:focus-visible+span{outline:3px solid var(--accent)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.empty{padding:38px 18px;text-align:center;color:var(--muted)}
.empty svg{width:72px;height:72px;margin-bottom:8px;opacity:.85}

/* stats */
.stat{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.stat .n{font-family:"Reem Kufi";font-size:clamp(26px,3.4vw,34px);line-height:1}
.stat .l{color:var(--muted);font-size:14px}
.stat i{position:absolute;inset-inline-end:-16px;top:-16px;width:74px;height:74px;border-radius:50%;opacity:.18}
.hero{border-radius:26px;padding:clamp(20px,3vw,32px);background:var(--brand);color:var(--onbrand);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:center}
.hero p{opacity:.88}
.hero .art{max-height:190px;justify-self:center}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero .art{max-height:130px}}
.alert{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--warnSoft);color:var(--warn);font-weight:500;flex-wrap:wrap}
.alert.br{background:var(--brandSoft);color:var(--brand)}
.alert.acc{background:var(--accentSoft);color:var(--accent)}

/* lists/tables */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;flex-wrap:wrap}
.item .grow{min-width:180px}
.av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:700;flex:none;color:#fff;font-family:"Reem Kufi"}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:13.5px;background:var(--surface2)}
td.num,th.num{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.hrow{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.hrow .bar{height:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;background:var(--surface2);padding:5px;border-radius:15px;border:1px solid var(--line);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:11px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:38px}
.tabs button.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh)}

/* quiz cards */
.qcard{position:relative;padding:20px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;overflow:hidden}
.qcard::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--c,var(--brand))}
.qcard h3{font-size:19px}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.type{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;text-align:start}
.type:hover{border-color:var(--brand);background:var(--brandSoft)}
.type svg{width:30px;height:30px;color:var(--brand)}
.type b{font-size:15px}.type small{color:var(--muted);font-size:12.5px;line-height:1.4}
.qed{border:1.5px solid var(--line);border-radius:20px;background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:12px}
.qed .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qnum{width:34px;height:34px;border-radius:11px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:700;flex:none}
.optrow{display:flex;gap:8px;align-items:center}
.optrow .in{min-height:42px}
.mark{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);display:grid;place-items:center;cursor:pointer;flex:none}
.mark.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mark svg{width:20px;height:20px}

/* taking */
.take{max-width:780px;margin-inline:auto}
.prog{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.prog button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.prog button.done{background:var(--brandSoft);border-color:var(--brand);color:var(--brand)}
.prog button.cur{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.timer{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700;padding:8px 14px;border-radius:12px;background:var(--brandSoft);color:var(--brand)}
.timer.low{background:var(--badSoft);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.qbody{font-size:19px;line-height:1.75;font-weight:500;white-space:pre-wrap}
.qimg{max-width:100%;max-height:340px;border-radius:14px;border:1px solid var(--line);margin-top:10px}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:15px;border:2px solid var(--line);background:var(--surface);cursor:pointer;text-align:start;font-size:16.5px;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--brand)}
.opt .k{width:32px;height:32px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:700;flex:none}
.opt.sel{border-color:var(--brand);background:var(--brandSoft)}
.opt.sel .k{background:var(--brand);color:var(--onbrand)}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tf .opt{justify-content:center;font-size:19px;font-weight:600;min-height:78px}
.blank{display:inline-block;width:150px;min-height:38px;border:0;border-bottom:2.5px solid var(--brand);background:var(--brandSoft);border-radius:8px 8px 0 0;padding:4px 10px;margin:0 4px;font-size:17px;text-align:center}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:10px;align-items:center;padding:10px;border-radius:14px;background:var(--surface2);margin-bottom:8px}
.ord{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);margin-bottom:8px}
.ord .n{width:30px;height:30px;border-radius:9px;background:var(--brand);color:var(--onbrand);display:grid;place-items:center;font-weight:700;flex:none}
.passage{padding:18px;border-radius:16px;background:var(--goldSoft);border-inline-start:5px solid var(--gold);white-space:pre-wrap;line-height:1.9}

/* result */
.ring{position:relative;width:min(240px,70vw);aspect-ratio:1;margin-inline:auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .v b{font-family:"Reem Kufi";font-size:clamp(42px,9vw,58px);line-height:1}
.ring circle.p{transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
.rv{padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:6px}
.rv.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.rv.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.rv.warn{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}

/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(40,8,24,.45);backdrop-filter:blur(4px);z-index:90;display:grid;place-items:center;padding:16px;animation:fade .2s}
.modal{background:var(--surface);border-radius:24px;padding:24px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{width:min(900px,100%)}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.94);opacity:0}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:99;background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:500;box-shadow:var(--sh);animation:pop .2s;max-width:92vw}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.auth .art{background:var(--brand);color:var(--onbrand);padding:clamp(24px,5vw,60px);display:flex;flex-direction:column;justify-content:space-between;gap:20px;position:relative;overflow:hidden}
.auth .art h1{font-size:clamp(34px,5vw,52px);line-height:1.05}
.auth .form{padding:clamp(24px,5vw,60px);display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:520px;width:100%;margin-inline:auto}
.auth .lugha{background-image:radial-gradient(circle at 85% 12%,rgba(255,217,138,.22),transparent 40%),radial-gradient(circle at 10% 95%,rgba(138,92,201,.28),transparent 45%)}
.auth .kick{font-size:17px;opacity:.85}
.auth h1.ruq{font-family:"Aref Ruqaa","Reem Kufi",serif;font-weight:700;font-size:clamp(56px,8.5vw,96px);line-height:1.15;text-shadow:0 4px 18px rgba(0,0,0,.18)}
.auth h1.ruq em{font-style:normal;color:#ffd98a}
.auth .who{display:flex;align-items:center;gap:12px;font-family:"Reem Kufi",sans-serif;font-size:clamp(20px,2.6vw,27px);font-weight:600}
.auth .who span{flex:0 0 34px;height:2px;background:#ffd98a;border-radius:2px}
.auth svg.book{width:min(100%,430px);align-self:center}
@media(max-width:760px){.auth{grid-template-columns:1fr}.auth .art{padding:24px 22px 28px;border-radius:0 0 28px 28px}.auth .art svg.big{max-height:150px}}

/* certificate */
.cert{position:relative;aspect-ratio:1.414;width:100%;max-width:900px;margin-inline:auto;border-radius:22px;overflow:hidden;color:#2b2210;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7% 9%;gap:2.2%;container-type:inline-size;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.cert .frame{position:absolute;inset:3.2%;border:2px solid var(--cf);border-radius:14px;pointer-events:none}
.cert .frame::after{content:"";position:absolute;inset:7px;border:1px dashed var(--cf);border-radius:10px;opacity:.6}
.cert .ttl{font-family:"Reem Kufi";font-size:7.2cqw;line-height:1.05;color:var(--ct)}
.cert .sub{font-size:2.3cqw;opacity:.8}
.cert .nm{font-family:"Reem Kufi";font-size:6cqw;line-height:1.1;color:var(--cn);padding:0 4cqw .6cqw;border-bottom:.35cqw solid var(--cf)}
.cert .bd{font-size:2.5cqw;line-height:1.7;max-width:80%;white-space:pre-wrap}
.cert .ft{display:flex;justify-content:space-between;width:80%;font-size:1.9cqw;margin-top:2cqw}
.cert .ft b{display:block;font-size:2.2cqw}
.cert .orn{position:absolute;pointer-events:none}
.cert .seal{width:12cqw;height:12cqw}
.cert.anim .ttl,.cert.anim .nm,.cert.anim .bd{animation:rise .9s both}
.cert.anim .nm{animation-delay:.25s}.cert.anim .bd{animation-delay:.45s}

.msg{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;width:100%}

.heat td{text-align:center;font-weight:600;font-size:13px;border:2px solid var(--surface)}
.print-head{display:none}
.savebar{position:sticky;bottom:12px;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.14)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media print{
 @page{size:A4;margin:12mm}

}

function lineSVG(pts) {

async function gemini(prompt, img, mime = 'image/jpeg') {
  S.ai ||= await DB.get('settings', 'ai'); const ai = S.ai; if (!ai?.key) throw new Error('أضف مفتاح Gemini من الإعدادات أولًا');
  const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(ai.model || 'gemini-2.5-flash')}:generateContent?key=${encodeURIComponent(ai.key)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, ...(img ? [{ inline_data: { mime_type: mime, data: img.split(',')[1] } }] : [])] }], generationConfig: { responseMimeType: 'application/json', temperature: .35 } }) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || 'خطأ من Gemini'); return JSON.parse(j.candidates[0].content.parts[0].text);
}

VIEWS.myres = () => {

  const tg = Object.entries(tags).map(([l, [a, b]]) => ({ l, v: pct(a, b) })).sort((a, b) => b.v - a.v);
  return `<div class="top"><div class="t"><h1>نتائجي</h1><p class="muted">${rows.length} اختبار</p></div></div><div class="col" style="gap:18px">

/* ---------------- question renderer ---------------- */
function renderQ(q, a, i, preview, seed = 1) {
  const dis = preview ? 'disabled' : ''; const L = 'أبجدهوزحطي';
  const head = q.type === 'passage' ? `<div class="passage">${esc(q.text)}</div>` : `<div class="row sp" style="margin-bottom:6px"><span class="chip br">${QT[q.type].n}${q.tag ? ' · ' + esc(q.tag) : ''}</span><span class="chip">${q.points} ${q.points == 1 ? 'درجة' : 'درجات'}</span></div>${q.type !== 'fill' ? `<div class="qbody">${esc(q.text)}</div>` : ''}${q.img ? `<img class="qimg" src="${esc(q.img)}" alt="صورة السؤال">` : ''}`;
  let body = '';
  const shuf = arr => S.take?.quiz?.shuffle ? shuffle(arr, seed + hashStr(q.id)) : arr;
  switch (q.type) {
    case 'mcq': body = `<div class="opts">${shuf(q.choices).map((c, j) => `<button class="opt ${a === c.id ? 'sel' : ''}" data-a="tAns" data-q="${q.id}" data-v="${c.id}" ${dis}><span class="k">${L[j] || j + 1}</span><span>${esc(c.t)}</span></button>`).join('')}</div>`; break;
    case 'multi': body = `<p class="small muted" style="margin-top:8px">اختر كل الإجابات الصحيحة</p><div class="opts">${shuf(q.choices).map((c, j) => `<button class="opt ${(a || []).includes(c.id) ? 'sel' : ''}" data-a="tMulti" data-q="${q.id}" data-v="${c.id}" ${dis}><span class="k">${(a || []).includes(c.id) ? ico('check', 'style="width:18px"') : L[j]}</span><span>${esc(c.t)}</span></button>`).join('')}</div>`; break;
    case 'tf': body = `<div class="tf">${[['true', 'صح'], ['false', 'خطأ']].map(([v, l]) => `<button class="opt ${a === v ? 'sel' : ''}" data-a="tAns" data-q="${q.id}" data-v="${v}" ${dis}>${ico(v === 'true' ? 'check' : 'x', 'style="width:26px"')} ${l}</button>`).join('')}</div>`; break;
    case 'short': body = `<input class="in" style="margin-top:14px;font-size:18px" data-t="${q.id}" value="${esc(a || '')}" placeholder="اكتب إجابتك" ${dis}>`; break;
    case 'essay': body = `<textarea class="in" style="margin-top:14px;min-height:180px;font-size:17px" data-t="${q.id}" placeholder="اكتب إجابتك هنا${q.minWords ? ` (${q.minWords} كلمة على الأقل)` : ''}" ${dis}>${esc(a || '')}</textarea><p class="small muted" id="wc-${q.id}">${normAr(a || '').split(' ').filter(Boolean).length} كلمة</p>`; break;
    case 'numeric': body = `<div class="row" style="margin-top:14px"><input class="in" style="max-width:220px;font-size:20px" inputmode="decimal" data-t="${q.id}" value="${esc(a ?? '')}" placeholder="الرقم" ${dis}>${q.unit ? `<b>${esc(q.unit)}</b>` : ''}</div>`; break;
    case 'fill': body = `<div class="qbody">${q.parts.map((p, j) => esc(p) + (j < q.parts.length - 1 ? `<input class="blank" data-t="${q.id}" data-k="${j}" value="${esc(a?.[j] || '')}" aria-label="الفراغ ${j + 1}" ${dis}>` : '')).join('')}</div>`; break;
    case 'match': body = `<div style="margin-top:14px">${q.left.map(l => `<div class="mrow"><b>${esc(l.t)}</b>${ico('back', 'style="width:22px;transform:scaleX(-1);color:var(--brand)"')}<select class="in" data-c="tMatch" data-q="${q.id}" data-l="${l.id}" ${dis}><option value="">اختر</option>${q.right.map(r => `<option value="${r.id}" ${a?.[l.id] === r.id ? 'selected' : ''}>${esc(r.t)}</option>`).join('')}</select></div>`).join('')}</div>`; break;
    case 'order': { const ord = a?.length ? a : q.items.map(x => x.id); body = `<p class="small muted" style="margin:8px 0">استخدم الأسهم لترتيب العناصر</p>${ord.map((id, j) => { const it = q.items.find(x => x.id === id); return it ? `<div class="ord"><span class="n">${j + 1}</span><span class="grow">${esc(it.t)}</span><button class="btn icon sm ghost" data-a="tOrd" data-q="${q.id}" data-j="${j}" data-d="-1" ${dis || (j === 0 ? 'disabled' : '')} aria-label="أعلى">${ico('up')}</button><button class="btn icon sm ghost" data-a="tOrd" data-q="${q.id}" data-j="${j}" data-d="1" ${dis || (j === ord.length - 1 ? 'disabled' : '')} aria-label="أسفل">${ico('down')}</button></div>` : ''; }).join('')}`; break; }
  }
  return head + body;
}

const takeKey = qid => 'qz_take_' + qid + '_' + S.user.uid;
A.startQuiz = async el => {
  const q = quizById(el.dataset.id); if (mySub(q.id)) return go('result', { id: q.id });
  const saved = store.get(takeKey(q.id), null);
  if (!saved) { if (!await ask(`بدء «${q.title}»؟`, `${q.questions.filter(x => x.type !== 'passage').length} سؤال${q.duration ? ` ومدة ${q.duration} دقيقة تبدأ الآن ولا تتوقف` : ''}. لديك محاولة واحدة.`, 'ابدأ')) return; }
  const t = saved && saved.order ? saved : { qid: q.id, ans: {}, start: now(), seed: Math.floor(Math.random() * 1e6), idx: 0 };
  const order = q.questions.map((_, i) => i).filter(i => q.questions[i].type !== 'passage'); t.order = q.shuffle ? groupShuffle(q.questions, t.seed) : order;
  S.take = { ...t, quiz: q }; store.set(takeKey(q.id), t); S.view = 'take'; render(); startTimer();
};
const passageIdx = (qs, i) => { for (let j = i - 1; j >= 0; j--) if (qs[j].type === 'passage') return j; return -1; };
function groupShuffle(qs, seed) { const blocks = new Map(); qs.forEach((q, i) => { if (q.type === 'passage') return; const p = passageIdx(qs, i); const k = p < 0 ? 'q' + i : 'p' + p; if (!blocks.has(k)) blocks.set(k, []); blocks.get(k).push(i); }); return shuffle([...blocks.values()], seed).flatMap(b => shuffle(b, seed + b[0])); }
const saveTake = () => { const t = S.take; store.set(takeKey(t.qid), { qid: t.qid, ans: t.ans, start: t.start, seed: t.seed, idx: t.idx, order: t.order }); };
let tmr; function startTimer() { clearInterval(tmr); const t = S.take; if (!t?.quiz.duration && !t?.quiz.dueAt) return; tmr = setInterval(() => { if (!S.take) return clearInterval(tmr); const left = timeLeft(); const el = $('#tmr'); if (el) { el.querySelector('b').textContent = fmtLeft(left); el.classList.toggle('low', left < 60000); } if (left <= 0) { clearInterval(tmr); toast('انتهى الوقت، يتم تسليم إجاباتك'); submitTake(true); } }, 1000); }
const timeLeft = () => { const t = S.take; const ends = [t.quiz.duration ? t.start + t.quiz.duration * 6e4 : Infinity, t.quiz.dueAt || Infinity]; return Math.min(...ends) - now(); };
const fmtLeft = ms => { if (!isFinite(ms)) return ''; ms = Math.max(0, ms); const s = Math.floor(ms / 1000); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
const answered = (q, a) => q.type === 'passage' || (a != null && a !== '' && !(Array.isArray(a) && !a.length) && !(typeof a === 'object' && !Array.isArray(a) && !Object.values(a).some(v => String(v ?? '').trim())));
function viewTake() {
  const t = S.take, q = t.quiz, ord = t.order, cur = q.questions[ord[t.idx]], left = timeLeft();
  const pi = passageIdx(q.questions, ord[t.idx]); const prev = pi >= 0 ? `<details open style="margin-bottom:16px"><summary class="small muted" style="cursor:pointer">النص القرائي</summary><div class="passage" style="margin-top:8px">${esc(q.questions[pi].text)}</div></details>` : '';
  const qnums = ord.map(i => q.questions[i]);
  return `<div class="row sp" style="margin-bottom:6px"><div><b class="disp" style="font-size:20px">${esc(q.title)}</b><div class="small muted">${esc(S.me.name)}</div></div><div class="row">${isFinite(left) ? `<span class="timer ${left < 60000 ? 'low' : ''}" id="tmr">${ico('clock', 'style="width:18px"')}<b>${fmtLeft(left)}</b></span>` : ''}<button class="btn ghost sm" data-a="takeExit">حفظ والخروج</button></div></div>
  <div class="prog" aria-label="الأسئلة">${qnums.map((x, n) => `<button class="${n === t.idx ? 'cur' : answered(x, t.ans[x.id]) ? 'done' : ''}" data-a="tJump" data-n="${n}" aria-label="سؤال ${n + 1}">${n + 1}</button>`).join('')}</div>
  <div class="bar" style="margin-bottom:18px"><i style="width:${pct(qnums.filter(x => answered(x, t.ans[x.id])).length, qnums.length)}%"></i></div>
  <section class="card" style="padding:clamp(18px,3vw,30px)">${prev}${renderQ(cur, t.ans[cur.id], t.idx, false, t.seed)}</section>
  <div class="row sp" style="margin-top:16px"><button class="btn ghost" data-a="tNav" data-d="-1" ${t.idx === 0 ? 'disabled' : ''}>${ico('back')} السابق</button>${t.idx < ord.length - 1 ? `<button class="btn" data-a="tNav" data-d="1">التالي ${ico('back', 'style="transform:scaleX(-1)"')}</button>` : `<button class="btn acc" data-a="tSubmit">${ico('send')} تسليم الإجابات</button>`}</div>
  ${t.idx < ord.length - 1 ? `<div class="center" style="margin-top:22px"><button class="btn ghost sm" data-a="tSubmit">تسليم الآن</button></div>` : ''}`;

const tRender = () => { render(); };
A.tAns = el => { S.take.ans[el.dataset.q] = el.dataset.v; saveTake(); tRender(); };

A.tSubmit = async () => { const t = S.take; const qs = t.quiz.questions.filter(x => x.type !== 'passage'); const miss = qs.filter(x => !answered(x, t.ans[x.id])).length; if (!await ask('تسليم الإجابات؟', miss ? `يوجد ${miss} سؤال بلا إجابة. لا يمكنك التعديل بعد التسليم.` : 'لا يمكنك التعديل بعد التسليم.', 'سلّم الآن')) return; submitTake(); };
document.addEventListener('input', e => { const el = e.target.closest('[data-t]'); if (!el || !S.take) return; const id = el.dataset.t; if (el.dataset.k != null) { const a = S.take.ans[id] ||= []; a[+el.dataset.k] = el.value; } else S.take.ans[id] = el.value; const wc = $('#wc-' + id); if (wc) wc.textContent = normAr(el.value).split(' ').filter(Boolean).length + ' كلمة'; saveTake(); });

VIEWS.qreport = () => {
  const q = quizById(S.p.id); if (!q) return VIEWS.reports(); const k = S.keys[q.id]; const res = quizResults(q.id); const P = res.map(r => r.ev.pct); const aud = quizAudience(q); const missing = aud.filter(u => !res.some(r => r.sub.uid === u.id));
  const n = res.length, g = Math.max(1, Math.round(n * .27)); const up = res.slice(0, g), lo = res.slice(-g);
  const items = q.questions.filter(x => x.type !== 'passage').map((x, i) => { const sc = it => it?.status === 'review' ? null : it ? it.score / (it.max || 1) : 0; const all = res.map(r => sc(r.ev.items.find(y => y.qid === x.id))).filter(v => v != null); const pU = avg(up.map(r => sc(r.ev.items.find(y => y.qid === x.id)) ?? 0)), pL = avg(lo.map(r => sc(r.ev.items.find(y => y.qid === x.id)) ?? 0)); const p = avg(all) * 100; const D = n >= 4 ? pU - pL : null; let dist = ''; if (x.type === 'mcq' && n) { const c = {}; res.forEach(r => { const a = r.sub.answers?.[x.id]; if (a) c[a] = (c[a] || 0) + 1; }); dist = x.choices.map(ch => `<span class="chip ${ch.id === k?.answers?.[x.id]?.correct ? 'ok' : ''}" title="${esc(ch.t)}">${esc(ch.t.slice(0, 18))}: ${pct(c[ch.id] || 0, n)}%</span>`).join(' '); } const flag = !n ? '' : p >= 90 ? '<span class="chip">سهل جدًا</span>' : p < 30 ? '<span class="chip bad">صعب جدًا</span>' : D != null && D < .15 ? '<span class="chip warn">تمييز ضعيف</span>' : '<span class="chip ok">جيد</span>'; return { x, i, p, D, dist, flag }; });
  return `<div class="top noprint">${backBtn()}<div class="row">${prBtn}<button class="btn ghost" data-a="exportQuiz" data-id="${q.id}">${ico('dl')} Excel</button>${isAdmin() ? `<button class="btn gold" data-a="certTo" data-ids="${res.filter(r => r.ev.pct >= 90).map(r => r.sub.uid).join(',')}" data-quiz="${q.id}">${ico('cert')} شهادات للمتفوقين</button>` : ''}</div></div>${printHead('تقرير اختبار: ' + q.title)}
  <div class="col" style="gap:18px"><div><h1>${esc(q.title)}</h1><p class="muted">${(q.classIds || []).map(clsName).join('، ')} · ${q.totalPoints} درجة · ${fmtDate(q.publishedAt || q.createdAt)}</p></div>
  <div class="grid g4">${stat(`${n}/${aud.length}`, 'المشاركة')}${stat(r1(avg(P)) + '%', 'المتوسط', 'var(--brand)')}${stat(r1(median(P)) + '%', 'الوسيط', 'var(--accent)')}${stat(pct(P.filter(p => p >= 50).length, n) + '%', 'نسبة النجاح', 'var(--ok)')}${stat((n ? Math.max(...P) : 0) + '%', 'أعلى درجة', 'var(--gold)')}${stat((n ? Math.min(...P) : 0) + '%', 'أقل درجة', 'var(--bad)')}${stat(r1(stdev(P)), 'الانحراف المعياري', 'var(--muted)')}${stat(n ? fmtLeft(avg(res.map(r => (r.sub.timeSpent || 0) * 1000))) : '-', 'متوسط وقت الحل', 'var(--brand)')}</div>

  <div class="card"><h3>ترتيب الطلاب</h3>${n ? `<table class="stack"><thead><tr><th>#</th><th>الطالب</th><th>الفصل</th><th class="num">الدرجة</th><th>التقدير</th><th></th></tr></thead><tbody>${res.map((r, i) => `<tr><td>${i + 1}</td><td><b>${esc(r.user.name)}</b></td><td>${esc(clsName(r.sub.classId))}</td><td class="num">${r.ev.total}/${r.ev.max} (${r.ev.pct}%)</td><td><span class="chip ${grade5(r.ev.pct)[1]}">${grade5(r.ev.pct)[0]}</span>${r.ev.pending ? ' <span class="chip warn">مراجعة</span>' : ''}</td><td class="noprint"><button class="btn sm ghost" data-a="subDetail" data-id="${r.sub.id}">التفاصيل</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">—</p>'}</div>

VIEWS.sreport = () => {
  const u = userById(S.p.id); if (!u) return VIEWS.reports(); const E = studentEvals(u.id); const P = E.map(e => e.ev.pct); const a = avg(P);
  const mates = classStudents(u.classId).map(m => ({ id: m.id, a: avg(studentEvals(m.id).map(e => e.ev.pct)), n: studentEvals(m.id).length })).filter(m => m.n).sort((x, y) => y.a - x.a); const rank = mates.findIndex(m => m.id === u.id) + 1;
  const tags = Object.entries(tagAgg(E.flatMap(e => e.ev.items))).map(([l, [s, m]]) => ({ l, v: pct(s, m) })).sort((x, y) => y.v - x.v);
  const types = {}; E.flatMap(e => e.ev.items).forEach(i => { if (i.status === 'review') return; const t = QT[i.q.type].n; (types[t] ||= [0, 0]); types[t][0] += i.score; types[t][1] += i.max; });
  const missed = S.quizzes.filter(q => ['published', 'closed'].includes(q.status) && q.classIds.includes(u.classId) && !E.some(e => e.q.id === q.id));
  const strong = tags.filter(t => t.v >= 80).slice(0, 3).map(t => t.l), weak = tags.filter(t => t.v < 60).slice(-3).map(t => t.l);
  const trend = P.length >= 2 ? P[P.length - 1] - P[0] : 0;
  const rec = [strong.length ? `يتميز في: ${strong.join('، ')}.` : '', weak.length ? `يحتاج دعمًا وتمارين إضافية في: ${weak.join('، ')}.` : '', P.length >= 2 ? (trend > 5 ? `مستواه في تحسن بمقدار ${r1(trend)} نقطة منذ أول اختبار.` : trend < -5 ? `تراجع مستواه ${r1(-trend)} نقطة منذ أول اختبار، يُنصح بمتابعته.` : 'مستواه ثابت عبر الاختبارات.') : '', missed.length ? `لم يؤدِّ ${missed.length} اختبار.` : ''].filter(Boolean);
  return `<div class="top noprint">${backBtn()}<div class="row">${prBtn}<button class="btn ghost" data-a="msgTo" data-id="${u.id}">${ico('msg')} رسالة</button>${isAdmin() ? `<button class="btn gold" data-a="certTo" data-id="${u.id}">${ico('cert')} شهادة</button>` : ''}</div></div>${printHead('تقرير الطالب')}
  <div class="col" style="gap:18px"><div class="row">${avatar(u.name, 64)}<div><h1>${esc(u.name)}</h1><p class="muted">${esc(clsName(u.classId))}${u.studentNo ? ' · ' + esc(u.studentNo) : ''}</p></div></div>
  <div class="grid g4">${stat(r1(a) + '%', 'المتوسط العام', pctColor(a))}${stat(E.length, 'اختبارات منجزة')}${stat(rank ? `${rank} / ${mates.length}` : '-', 'الترتيب في الفصل', 'var(--gold)')}${stat(grade5(a)[0], 'التقدير العام', 'var(--accent)')}</div>
  ${rec.length ? `<div class="card" style="background:var(--brandSoft);border-color:transparent"><h3>${ico('spark', 'style="width:20px;vertical-align:middle"')} قراءة ذكية لأداء الطالب</h3><ul style="margin:0;padding-inline-start:20px;line-height:2">${rec.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}

const HEAD_RE = /^(م|#|ت|الرقم|رقم|الاسم|اسم الطالب|اسم الطالبة|الطالب|الطالبة|name|no|id|الفصل|الصف)$/i;
function parseRoster(txt, defCls) {
  const out = [];
  for (let line of String(txt || '').replace(/\r/g, '').split('\n')) {
    line = line.trim(); if (!line) continue;
    let cells = line.split(/\t|,|؛|;|\|/).map(x => x.trim()).filter(Boolean);
    let name = '', no = '', classId = defCls || '';
    if (cells.length === 1) { const m = latinDigits(line).match(/\d{3,}/); if (m) { no = m[0]; cells = [line.replace(/[0-9٠-٩]{3,}/, '').trim()]; } }
    for (const c of cells) {
      const d = latinDigits(c).replace(/\s/g, '');
      if (/^\d{3,}$/.test(d) && !no) { no = d; continue; }
      if (/^\d{1,2}[-.)]?$/.test(d)) continue;
      const k = S.classes.find(x => normAr(x.name) === normAr(c) || (normAr(c).length > 3 && normAr(x.name).includes(normAr(c))));
      if (k && cells.length > 1) { classId = k.id; continue; }
      if (/\p{L}/u.test(c) && c.length > name.length) name = c;
    }
    name = name.replace(/^[0-9٠-٩]+\s*[-.)]\s*/, '').replace(/\s+/g, ' ').trim();
    if (name.length < 3 || HEAD_RE.test(name)) continue;
    out.push({ name, no, classId, ok: true });
  }
  return out;
}

/* PDF text comes either in logical order or in visual order (glyphs left to right, Arabic presentation forms).

function pdfLines(items) {
  const its = items.filter(i => i.str !== undefined && i.transform).map(i => ({ s: i.str, x: i.transform[4], y: i.transform[5], w: i.width || 0, h: Math.abs(i.height || i.transform[3] || 10) }));

  for (const it of its) { let L = lines.find(l => Math.abs(l.y - it.y) < Math.max(2, it.h * 0.35)); if (!L) { L = { y: it.y, items: [] }; lines.push(L); } L.items.push(it); }

  const logical = lines.map(l => join(l.items)).join('\n');
  const visual = lines.map(l => {
    const its2 = l.items.filter(it => it.s.trim()).sort((a, b) => (b.x + b.w) - (a.x + a.w)); const out = [];
    for (let i = 0; i < its2.length;) { if (ltr(its2[i])) { let j = i; while (j < its2.length && ltr(its2[j])) j++; out.push(...its2.slice(i, j).reverse()); i = j; } else out.push(its2[i++]); }

  for (const [e, n, c, lv] of names) { const uid = mk(e + '@demo.sa'); U[e] = { uid, n, c, lv }; await DB.set('users', uid, { name: n, email: e + '@demo.sa', role: 'student', classId: c, studentNo: String(1000 + Object.keys(U).length), active: true, createdAt: now() - 864e5 * 20 }); }
  mk('pending@demo.sa');
  await DB.set('users', acc['pending@demo.sa'].uid, { name: 'أ. أمل الخالدي', email: 'pending@demo.sa', role: 'pending_delegate', active: true, createdAt: now() });
  store.set('qz_demo_acc', acc);
  for (const t of DEFAULT_TEMPLATES) await DB.add('templates', { ...t, createdAt: now() });

  const mq = (type, o) => Object.assign(newQ(type), o);
  const Q1 = [
    mq('mcq', { text: 'ما عاصمة المملكة العربية السعودية؟', tag: 'الجغرافيا', choices: [{ id: 'a', t: 'جدة', ok: false }, { id: 'b', t: 'الرياض', ok: true }, { id: 'c', t: 'الدمام', ok: false }, { id: 'd', t: 'مكة المكرمة', ok: false }] }),
    mq('tf', { text: 'يقع الخليج العربي في شرق المملكة.', tag: 'الجغرافيا', correct: 'true' }),
    mq('short', { text: 'ما اسم أكبر صحراء رملية متصلة في المملكة؟', tag: 'الجغرافيا', points: 2, accepted: ['الربع الخالي'] }),
    mq('multi', { text: 'اختر المدن الساحلية:', tag: 'الجغرافيا', points: 2, choices: [{ id: 'a', t: 'جدة', ok: true }, { id: 'b', t: 'الدمام', ok: true }, { id: 'c', t: 'بريدة', ok: false }, { id: 'd', t: 'ينبع', ok: true }] }),
    mq('match', { text: 'صِل كل منطقة بمدينتها:', tag: 'المناطق', points: 3, pairs: [{ id: 'p1', l: 'المنطقة الشرقية', r: 'الدمام' }, { id: 'p2', l: 'منطقة القصيم', r: 'بريدة' }, { id: 'p3', l: 'منطقة عسير', r: 'أبها' }], extra: ['تبوك'] }),
    mq('fill', { text: 'توحدت المملكة على يد الملك [[عبدالعزيز|عبد العزيز]] عام [[1932|1351]]', tag: 'التاريخ', points: 2 }),
    mq('order', { text: 'رتّب المدن من الشمال إلى الجنوب:', tag: 'المناطق', points: 2, items: [{ id: 'o1', t: 'تبوك' }, { id: 'o2', t: 'المدينة المنورة' }, { id: 'o3', t: 'مكة المكرمة' }, { id: 'o4', t: 'جازان' }] }),
    mq('essay', { text: 'اكتب فقرة قصيرة عن أهمية رؤية المملكة 2030.', tag: 'التعبير', points: 5, model: 'تهدف رؤية 2030 إلى تنويع الاقتصاد وتقليل الاعتماد على النفط وتطوير التعليم والسياحة وتمكين الشباب', keywords: ['تنويع الاقتصاد', 'النفط', 'السياحة', 'الشباب'] })
  ];
  const Q2 = [
    mq('numeric', { text: 'كم يساوي 12 × 4 ؟', tag: 'الضرب', value: 48 }),
    mq('numeric', { text: 'ما ناتج 3.5 + 1.25 ؟', tag: 'الكسور العشرية', value: 4.75, tol: .01 }),
    mq('mcq', { text: 'أي الأعداد التالية عدد أولي؟', tag: 'الأعداد', choices: [{ id: 'a', t: '9', ok: false }, { id: 'b', t: '15', ok: false }, { id: 'c', t: '13', ok: true }, { id: 'd', t: '21', ok: false }] }),
    mq('tf', { text: 'مجموع زوايا المثلث 360 درجة.', tag: 'الهندسة', correct: 'false' }),
    mq('short', { text: 'ماذا نسمي الشكل الرباعي الذي أضلاعه متساوية وزواياه قائمة؟', tag: 'الهندسة', accepted: ['المربع', 'مربع'] })
  ];
  const mkQuiz = async (id, title, qs, classIds, createdBy, createdByName, status, extra = {}) => { const parts = qs.map(splitQ); await DB.set('quizzes', id, { title, desc: '', classIds, duration: 20, dueAt: 0, resultsMode: 'instant', showAnswers: true, shuffle: false, questions: parts.map(p => p.pub), totalPoints: sum(parts.map(p => p.pub.points)), status, pubClasses: status === 'published' ? classIds : [], createdBy, createdByName, createdAt: now() - 864e5 * 9, publishedAt: now() - 864e5 * 9, released: false, ...extra }); await DB.set('quizKeys', id, { answers: Object.fromEntries(parts.map(p => [p.pub.id, p.key])) }); return parts; };
  const P1 = await mkQuiz('demoQ1', 'اختبار وطني الغالي', Q1, ['c1', 'c2', 'c3'], admin, 'أ. نورة', 'published');
  const P2 = await mkQuiz('demoQ2', 'مراجعة الرياضيات', Q2, ['c1', 'c3'], admin, 'أ. نورة', 'published', { createdAt: now() - 864e5 * 3, publishedAt: now() - 864e5 * 3 });
  await mkQuiz('demoQ3', 'اختبار قصير في العلوم', [mq('mcq', { text: 'ما الكوكب الأقرب إلى الشمس؟', tag: 'الفضاء', choices: [{ id: 'a', t: 'عطارد', ok: true }, { id: 'b', t: 'المريخ', ok: false }, { id: 'c', t: 'الأرض', ok: false }] }), mq('tf', { text: 'الماء يغلي عند 100 درجة مئوية عند مستوى سطح البحر.', tag: 'المادة', correct: 'true' })], ['c2'], huda, 'أ. هدى العتيبي', 'pending');
  // simulate answers
  const shortAlt = { 'الربع الخالي': ['الربع الخالى', 'ربع الخالي', 'صحراء الربع', 'النفود', 'الربع الخالي'] };
  const answerFor = (p, lv, r) => {
    const k = p.key, q = p.pub, ok = r() < lv;
    switch (q.type) {
      case 'mcq': return ok ? k.correct : q.choices.find(c => c.id !== k.correct).id;
      case 'tf': return ok ? k.correct : (k.correct === 'true' ? 'false' : 'true');
      case 'multi': return ok ? k.correct : k.correct.slice(0, 1).concat(['c']);
      case 'short': return ok ? (r() < .6 ? k.accepted[0] : (shortAlt[k.accepted[0]] || k.accepted)[Math.floor(r() * 3)]) : (shortAlt[k.accepted[0]] || ['لا أعرف'])[3] || 'مستطيل';
      case 'match': return Object.fromEntries(Object.entries(k.pairs).map(([l, rr], i) => [l, ok || i ? rr : q.right[0].id]));
      case 'fill': return ok ? k.blanks.map(b => b[0]) : [k.blanks[0][0], '1940'];
      case 'order': return ok ? k.order : [k.order[1], k.order[0], ...k.order.slice(2)];
      case 'numeric': return ok ? String(k.value) : String(k.value + 2);
      case 'essay': return lv > .8 ? 'رؤية 2030 مهمة لأنها تنوع الاقتصاد وتقلل الاعتماد على النفط وتهتم بالسياحة وتمكين الشباب' : 'الرؤية مهمة للوطن وتطوره في المستقبل';
    }
  };
  let seed = 7; const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (const [qid, P, cl, days] of [['demoQ1', P1, ['c1', 'c2', 'c3'], 8], ['demoQ2', P2, ['c1', 'c3'], 2]]) {
    for (const [key, s] of Object.entries(U)) {
      if (!cl.includes(s.c) || (qid === 'demoQ2' && key === 'joud')) continue;
      const lv = qid === 'demoQ2' && key === 'reem' ? .8 : s.lv;
      const answers = Object.fromEntries(P.map(p => [p.pub.id, answerFor(p, lv, r)]));
      const t = now() - 864e5 * days + Math.floor(r() * 7e6);
      await DB.set('submissions', qid + '_' + s.uid, { quizId: qid, uid: s.uid, name: s.n, classId: s.c, ownerId: admin, answers, startedAt: t - 9e5, submittedAt: t, timeSpent: 400 + Math.floor(r() * 700) });
    }
  }
  // a reviewed essay for sara
  const essayId = P1[7].pub.id; await DB.set('reviews', 'demoQ1_' + U.sara.uid, { quizId: 'demoQ1', uid: U.sara.uid, overrides: { [essayId]: { points: 5, note: 'فقرة رائعة ومكتملة', by: admin, at: now() } }, reviewedAt: now() });
  const M = (o) => DB.add('messages', { kind: 'msg', readBy: [], createdAt: now() - 36e5 * (2 + Math.floor(r() * 40)), ...o });
  await M({ from: admin, fromName: 'أ. نورة', to: 'all', toName: 'كل الطلاب', subject: 'مرحبًا بكم في منصة سبورة', body: 'أهلًا بكم جميعًا. ستجدون هنا الاختبارات والنتائج ورسائلي لكم. بالتوفيق!' });
  await M({ from: admin, fromName: 'أ. نورة', to: 'class:c1', toName: C[0][1], subject: 'اختبار الرياضيات', body: 'تم نشر مراجعة الرياضيات، أتمنى لكم التوفيق.' });
  await M({ from: U.lama.uid, fromName: 'لمى القحطاني', to: 'admin', toName: 'المعلم', subject: 'سؤال عن الاختبار القادم', body: 'أستاذة، هل يشمل الاختبار القادم درس الخرائط؟' });
  const t0 = DEFAULT_TEMPLATES[0]; const su = { name: U.sara.n, classId: 'c1' };
  await DB.add('messages', { from: admin, fromName: 'أ. نورة', to: U.sara.uid, toName: U.sara.n, kind: 'cert', subject: t0.heading, body: '', cert: { theme: t0.theme, emblem: t0.emblem, heading: t0.heading, body: fillVars(t0.body, { 'الاختبار': 'اختبار وطني الغالي', 'الدرجة': 'الدرجة الكاملة' }), name: su.name, className: C[0][1], teacher: 'أ. نورة', school: 'المتوسطة الأولى بالدمام', date: fmtDate(now()) }, createdAt: now() - 36e5, readBy: [] });
  store.set('qz_demo_seeded', true);
}

/* ---------------- start ---------------- */
if (store.get('qz_theme', '')) document.documentElement.dataset.theme = store.get('qz_theme', '');
boot();

})();
</script>
